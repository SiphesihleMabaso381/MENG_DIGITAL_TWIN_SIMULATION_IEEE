[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meng-digital-twin-simulation-ieee"
version = "1.0.0"
description = "A South Africa-oriented digital-twin prototype for feeder-level power-flow, metering-quality, and NTL analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Siphesihle Mabaso" }]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "opendssdirect.py==0.9.4",
    "pyyaml>=5.4.0",
    "python-dotenv>=0.19.0",
    "tqdm>=4.62.0",
    "requests>=2.26.0",
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
